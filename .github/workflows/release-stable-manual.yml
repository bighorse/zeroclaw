name: Release Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to release (e.g. 0.2.0)"
        required: true
        type: string
      macos_only:
        description: "Build macOS (aarch64-apple-darwin) only — skips Linux, Windows, Docker"
        required: false
        type: boolean
        default: false

concurrency:
  group: promote-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate semver and Cargo.toml match
        id: check
        shell: bash
        run: |
          set -euo pipefail
          input_version="${{ inputs.version }}"
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)

          if [[ ! "$input_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be semver (X.Y.Z). Got: ${input_version}"
            exit 1
          fi

          if [[ "$cargo_version" != "$input_version" ]]; then
            echo "::error::Cargo.toml version (${cargo_version}) does not match input (${input_version}). Bump Cargo.toml first."
            exit 1
          fi

          tag="v${input_version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [validate]
    uses: ./.github/workflows/release-build.yml
    with:
      macos_only: ${{ inputs.macos_only }}
      retention_days: 14

  publish:
    name: Publish Stable Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: zeroclaw-*
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} + | sed 's|  \./[^/]*/|  |' > SHA256SUMS
          cat SHA256SUMS

      - name: Create and push git tag
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag "${{ needs.validate.outputs.tag }}"
          git push origin "${{ needs.validate.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          FILES=$(find artifacts -type f | sort | tr '\n' ' ')
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $FILES

  homebrew:
    name: Update Homebrew Tap
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Get macOS artifact checksum
        id: checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA256=$(gh release download "${{ needs.validate.outputs.tag }}" \
            --repo bighorse/zeroclaw \
            --pattern "SHA256SUMS" \
            --output - \
            | grep "zeroclaw-aarch64-apple-darwin.tar.gz" \
            | awk '{print $1}')
          echo "macos_arm=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Generate Homebrew formula
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          VERSION="${{ inputs.version }}"
          SHA256="${{ steps.checksum.outputs.macos_arm }}"
          cat > zeroclaw.rb << EOF
          # typed: false
          # frozen_string_literal: true

          class Zeroclaw < Formula
            desc "Zero overhead. Zero compromise. 100% Rust. The fastest, smallest AI assistant."
            homepage "https://github.com/bighorse/zeroclaw"
            version "${VERSION}"
            license "MIT OR Apache-2.0"

            # Pre-built binary for Apple Silicon (aarch64-apple-darwin).
            # Works with both /opt/homebrew (native ARM) and /usr/local Homebrew under Rosetta.
            url "https://github.com/bighorse/zeroclaw/releases/download/${TAG}/zeroclaw-aarch64-apple-darwin.tar.gz"
            sha256 "${SHA256}"

            def install
              bin.install "zeroclaw"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/zeroclaw --version")
            end
          end
          EOF

      - name: Push formula to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/bighorse/homebrew-zeroclaw.git tap
          mkdir -p tap/Formula
          cp zeroclaw.rb tap/Formula/zeroclaw.rb
          cd tap
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/zeroclaw.rb
          git commit -m "zeroclaw ${{ inputs.version }}"
          git push

  docker:
    name: Push Docker Image
    needs: [validate, build]
    if: ${{ !inputs.macos_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
