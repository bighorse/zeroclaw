# Shared build pipeline for both release workflows.
#
# Beta and stable publish differently (prerelease vs tag+Homebrew+:latest), but
# they compile the same way. Keeping one copy of the build here is what stops
# the two from drifting: `--features channel-lark` was added to stable and
# missed on beta, and every beta artifact shipped without the Feishu/Lark
# channel until that was caught in production.
name: Release Build

on:
  workflow_call:
    inputs:
      macos_only:
        description: "Build aarch64-apple-darwin only — skips Linux and Windows"
        required: false
        type: boolean
        default: false
      retention_days:
        description: "How long to keep the build artifacts"
        required: false
        type: number
        default: 7

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Build Web Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web dashboard
        run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  setup:
    name: Setup Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.macos_only }}" = "true" ]; then
            echo 'matrix={"include":[{"os":"macos-14","target":"aarch64-apple-darwin","artifact":"zeroclaw","ext":"tar.gz"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact":"zeroclaw","ext":"tar.gz"},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","artifact":"zeroclaw","ext":"tar.gz","cross_compiler":"gcc-aarch64-linux-gnu","linker_env":"CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER","linker":"aarch64-linux-gnu-gcc"},{"os":"macos-14","target":"aarch64-apple-darwin","artifact":"zeroclaw","ext":"tar.gz"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","artifact":"zeroclaw","ext":"tar.gz"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact":"zeroclaw.exe","ext":"zip"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [web, setup]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        if: runner.os != 'Windows'

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Install cross compiler
        if: matrix.cross_compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.cross_compiler }}

      - name: Build release
        shell: bash
        run: |
          if [ -n "${{ matrix.linker_env || '' }}" ] && [ -n "${{ matrix.linker || '' }}" ]; then
            export "${{ matrix.linker_env }}=${{ matrix.linker }}"
          fi
          cargo build --release --locked --features channel-lark --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../zeroclaw-${{ matrix.target }}.${{ matrix.ext }} ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../zeroclaw-${{ matrix.target }}.${{ matrix.ext }} ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zeroclaw-${{ matrix.target }}
          path: zeroclaw-${{ matrix.target }}.${{ matrix.ext }}
          retention-days: ${{ inputs.retention_days }}
